name: Release correctness gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: JavaScript syntax and truthful-results regressions
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          node tools/Release-Regression.mjs
      - name: Collector persistence and failure monitoring
        shell: bash
        run: |
          python3 -m unittest discover -s tools/global_coverage -p 'test_*.py'
          python3 tools/Test-OperationsHealth.py
          python3 tools/Test-ReleaseGate.py
